# Committed deliberately: this is presentation, not secrets. The sponsor-facing
# secrets live in .streamlit/secrets.toml, which is gitignored.

[theme]
# Storm/utility palette rather than Streamlit's default red, so the app reads
# as a deliberate product to sponsors instead of a framework demo.
primaryColor = "#1f6feb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f2f6fc"
textColor = "#16202c"

[client]
# Sponsors should never see a Python traceback. Errors still reach the app's
# own st.error() panels, which are written for humans; this only suppresses
# the raw stack trace that would otherwise render in the browser.
showErrorDetails = "none"

[browser]
gatherUsageStats = false
