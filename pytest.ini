[pytest]
testpaths = tests
# No addopts: `-q` here would combine with a `-q` on the command line into
# `-qq`, which hides the pass/fail summary line. Callers pass their own
# verbosity.
#
# Parallel runs are opt-in (-n auto). They need pytest-xdist, and each worker
# takes its own schema via PYTEST_XDIST_WORKER -- see tests/pg_harness.py.
